<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xenonika | The Future in Progress</title>
    <!-- (बाकी सारे Meta tags वही रहेंगे) -->
    <meta name="description" content="Xenonika is an AI-native systems and software studio founded by Gautam (@gautam.0ng).">
    <link rel="icon" href="logo.png" type="image/png">

    <style>
        /* (आपकी पुरानी CSS वही रहेगी) */
        :root { --bg-color: #080b11; --card-bg: #0f172a; --accent-color: #38bdf8; --text-main: #f8fafc; --text-muted: #94a3b8; --border-color: #1e293b; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 2rem 1rem; }
        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 4rem; padding-top: 2rem; }
        .profile-img { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--accent-color); margin: 0 auto 1.5rem auto; object-fit: cover; }
        h1 { font-size: 3.2rem; font-weight: 800; background: linear-gradient(135deg, #fff 0%, #94a3b8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .handle { color: var(--accent-color); font-size: 1.2rem; font-weight: 600; margin-bottom: 1rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; }
        .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 1.8rem; }
        .card h3 { color: var(--accent-color); margin-bottom: 0.8rem; }
        footer { text-align: center; margin-top: 4rem; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 2rem; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <img src="gautam.png" alt="Gautam" class="profile-img">
            <h1>XENONIKA</h1>
            <div class="handle">Architected by Gautam (@gautam.0ng)</div>
        </header>

        <!-- यहाँ प्रोजेक्ट्स आएंगे -->
        <h2>Live Projects</h2>
        <div id="projects-container" class="grid" style="margin-top: 2rem;">
            <!-- JavaScript यहाँ कार्ड्स लोड करेगा -->
            <p style="color: var(--text-muted);">Loading projects from Xenonika Labs...</p>
        </div>

        <footer>
            <p>© 2026 XENONIKA. All rights reserved.</p>
        </footer>
    </div>

    <script>
        // Firebase से प्रोजेक्ट्स खींचने का फंक्शन
        async function loadProjects() {
            const container = document.getElementById('projects-container');
            const url = 'https://kayasth-vision-c664a-default-rtdb.firebaseio.com/projects.json';
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                container.innerHTML = ''; // Loading मैसेज हटाओ

                if (data) {
                    // Firebase से आया डेटा लूप में चलाओ
                    Object.values(data).forEach(project => {
                        const card = `
                            <div class="card">
                                <h3>${project.title}</h3>
                                <p style="color: var(--text-muted); margin-bottom: 1rem;">${project.description}</p>
                                <a href="${project.url}" target="_blank" style="color: var(--accent-color); font-weight: bold; text-decoration: none;">Open Project →</a>
                            </div>
                        `;
                        container.innerHTML += card;
                    });
                } else {
                    container.innerHTML = '<p>No projects found in the vault.</p>';
                }
            } catch (error) {
                console.error("Error loading projects:", error);
                container.innerHTML = '<p>System offline. Please check connection.</p>';
            }
        }

        // वेबसाइट लोड होते ही फंक्शन चलाओ
        loadProjects();
    </script>
</body>
</html>
